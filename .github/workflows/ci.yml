name: CI

on:
  push:
    branches:
      - game
  pull_request:
    branches:
      - game

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Environment Check
        run: env

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential

      - name: Build project
        run: |
          make
